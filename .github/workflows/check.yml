name: check catalog

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog and generated index
        run: python3 tools/build.py --check
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
