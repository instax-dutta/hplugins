name: auto-merge verified PRs

on:
  workflow_run:
    workflows: ["check catalog"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gather verification payloads from the base repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          pr="$PR_NUMBER"
          if [ -z "$pr" ]; then
            pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "No pull request found for $HEAD_SHA"
            exit 0
          fi
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"

          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          gh api "repos/$REPO/pulls/$pr" > pr.json
          gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate --slurp > checks.json
          gh api "repos/$REPO/pulls/$pr/reviews" --paginate --slurp > reviews.json
          gh api "repos/$REPO/pulls/$pr/files" --paginate --slurp > files.json
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){pageInfo{hasNextPage}nodes{isResolved}}}}}' \
            -f owner="${REPO%%/*}" -f repo="${REPO##*/}" -F number="$pr" > threads.json

      - name: Decide and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          decision=$(python3 tools/automerge_check.py .)
          echo "$decision"
          if [ "$decision" != "MERGE" ]; then
            exit 0
          fi

          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "PR changed after verification; skipping"
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash
